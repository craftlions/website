min_version = "2026.11.8"

[tools]
aube = "2.10.0"
hk = "2.12.0"
jactionlint = "2.6.0"
"aqua:koalaman/shellcheck" = "0.11.0"
node = "26.13.1"
fnox = { version = "1.48.0", workflow = "release.yml" }

[settings]
experimental = true

[secrets.fnox]

[tasks.dev]
description = "Start the dev server with every secret from fnox (owner only)"
secrets = [
  "BETTER_AUTH_SECRETS",
  "BETTER_AUTH_API_KEY",
  "GITHUB_CLIENT_SECRET",
  "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE",
]
run = "aubr dev"

[tasks."db:check"]
description = "Check the Drizzle migrations with the database URL from fnox"
secrets = ["CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE"]
run = "aubx drizzle-kit check"

[tasks."db:migrate"]
description = "Apply the Drizzle migrations to the database from fnox (owner only)"
depends = ["db:check"]
confirm = "Apply the migrations in drizzle/ to the database?"
lock = true
secrets = ["CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE"]
run = "aubx drizzle-kit migrate"

[tasks.build]
description = "Build the Worker without secrets"
hide = true
run = "aubr build"

[tasks."secrets:push"]
description = "Deploy the Worker with its runtime secrets from fnox (owner only)"
usage = 'flag "--dry-run" help="Build and check without uploading"'
depends = ["build"]
confirm = "Deploy the Worker with the secrets from fnox?"
lock = true
secrets = ["BETTER_AUTH_SECRETS", "BETTER_AUTH_API_KEY", "GITHUB_CLIENT_SECRET"]
run = "aubr cf deploy --prebuilt --secrets-file cloudflare.secrets.env{% if usage.dry_run %} --dry-run{% endif %}"
