name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The Validation checks that need no secret and change no tracked file; the
  # migration check needs the database URL and stays local.
  static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    name: Static Checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          experimental: true
      - run: aube ci
      - run: aubr cf-check
      - run: aubx astro sync
      - run: aubr check
      - run: aubr design:lint
      - run: aubr unit
      - run: aubx biome ci
      - run: jactionlint --no-online --strict-exit .github/workflows/*.yml

  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    name: Browser Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a11y
            script: a11y
          - name: design
            script: design:test
          - name: e2e
            script: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          experimental: true
      - run: aube ci
      - name: Read Playwright Version
        id: playwright
        run: echo "version=$(aubx playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: aubx playwright install --with-deps --only-shell chromium
      - run: aubr "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
