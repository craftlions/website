name: Deploy

on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - "main"

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Deploy to Production
    environment:
      name: production
      url: https://craftlions.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          experimental: true
      - run: aube ci
      - run: aube build
      - run: aubr cf deploy --prebuilt

  preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Deploy Pull Request Preview
    environment:
      name: preview
      url: ${{ steps.preview.outputs.preview_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          experimental: true
      - run: aube ci
      - name: Deploy Preview
        id: preview
        run: |
          set -o pipefail
          aubr cf previews deploy "$PREVIEW_NAME" | tee preview.json
          preview_url=$(jq -r '.preview_urls[0] // empty' preview.json)
          deployment_url=$(jq -r '.deployment_urls[0] // empty' preview.json)
          {
            echo "preview_url=$preview_url"
            echo "deployment_url=$deployment_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Pull Request Preview"
            echo
            echo "Preview URL: ${preview_url:-unavailable in cf output}"
            echo "Deployment URL: ${deployment_url:-unavailable in cf output}"
          } >> "$GITHUB_STEP_SUMMARY"

  preview-cleanup:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Delete Pull Request Preview
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          experimental: true
      - run: aube ci
      - run: aubr cf previews delete "$PREVIEW_NAME" --worker craftlions-website
